[package]
name = "codex-plus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A minimal account switcher injected into the OpenAI Codex desktop app"

[[bin]]
name = "codex-plus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.26"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
] }
