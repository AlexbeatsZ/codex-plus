[package]
name = "codex-plus"
version = "0.3.5-omen"
edition = "2024"
license = "MIT"
description = "A Windows launcher for OpenAI Codex with account, provider, and local MCP tools"

[[bin]]
name = "codex-plus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
base64 = "0.22"
fs2 = "0.4"
futures-util = "0.3"
axum = "0.8"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["elcapitan"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
